name: SideQuest

# SideQuest's GitHub integration takes no push from CI any more, so this is a
# reporter, not a notifier. Its release-webhook answers 200 whatever happens -
# a malformed payload comes back 200 "No! repo", a well-formed one comes back
# 200 with an empty body and changes nothing (v0.3.0, v0.5.0-rc) - and the
# version-webhook it used to pair with answers 410 Gone to every request, a
# deliberately fake token included. Neither status code was ever an oracle.
#
# What is left that IS true: the public listing says what SideQuest serves, and
# the Developer Portal's Release dropdown reads the repo's releases live. So
# this checks the release carries an APK, checks what the listing serves, and
# prints the manual steps when the two disagree.
#
# SideQuest only accepts a build whose Android versionCode is HIGHER than the
# one already listed. That lives in RetroXR/export_presets.cfg (`version/code`)
# and has to be bumped by hand alongside `version/name`.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of an existing release to check (e.g. v0.2.0)
        required: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      APP_ID: '61366'
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Check the release carries an APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
                  | jq -r '[.assets[] | select(.name | endswith(".apk"))] | first | .name // ""')
          if [ -z "$apk" ]; then
            echo "::error::release $TAG carries no .apk asset - nothing for SideQuest to pick up"
            exit 1
          fi
          echo "$TAG -> $apk"

      - name: Report what SideQuest is serving
        run: |
          set -uo pipefail

          # api.sidequestvr.com 403s a bare urllib-style client; curl is fine.
          now=$(curl -sS --max-time 30 "https://api.sidequestvr.com/v2/apps/$APP_ID" \
                  | jq -r '[.urls[] | select(.provider == "Github Release") | .link_url] | join(" ")' || true)
          case "$now" in
            *"/download/$TAG/"*)
              echo "SideQuest is serving $TAG:"
              echo "  $now"
              exit 0 ;;
          esac

          echo "listing serves: ${now:-<unreadable>}"
          {
            echo "### SideQuest still needs a hand"
            echo
            echo "The listing is not serving \`$TAG\` yet. Set it by hand:"
            echo
            echo "Developer Portal > RetroXR > Edit listing > Distribution > **Release**,"
            echo "choose \`$TAG\`, then *Save & publish*. That dropdown reads the repo's"
            echo "releases directly, so \`$TAG\` is already in it, and the sync pulls every"
            echo "asset on the release (the Windows .zip comes along with the APK)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::SideQuest is not serving $TAG - set it by hand in the Developer Portal (steps in the job summary)"
